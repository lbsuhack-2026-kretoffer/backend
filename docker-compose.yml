version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: hakaton_db
    environment:
      POSTGRES_USER: school
      POSTGRES_PASSWORD: school
      POSTGRES_DB: school_balance
    ports:
      - "5432:5432"
    restart: unless-stopped

  backend:
    build: .
    container_name: hakaton_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://school:school@db:5432/school_balance
      - SEED_DEMO=true
    depends_on:
      - db
    restart: unless-stopped