services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: school
      POSTGRES_PASSWORD: school
      POSTGRES_DB: school_balance
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://school:school@db:5432/school_balance
      SECRET_KEY: dev-secret
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000"]'
      SEED_DEMO: "true"
    depends_on:
      - db
    ports:
      - "8000:8000"

volumes:
  pgdata: