[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "B008",  # FastAPI Depends() в аргументах — норма
    "E501",  # длину строк контролирует formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert в тестах — ок
"app/seed.py" = ["E501"]  # длинные списки имён

[tool.ruff.format]
quote-style = "double"
indent-style = "space"